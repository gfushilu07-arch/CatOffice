<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Small rendition of the CatOffice mark for 16/24/32 px: whiskers and
       document text lines dropped, ears/eyes enlarged so the cat survives
       pixel-thin sizes. Same geometry as catoffice-icon.svg otherwise. -->
