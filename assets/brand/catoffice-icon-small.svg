    <linearGradient id="paper" x1="512" y1="300" x2="512" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFCF5"/>
      <stop offset="1" stop-color="#FBF0DC"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <rect x="318" y="318" width="400" height="520" rx="44" fill="#A34708" opacity="0.2"/>

